[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ns-takehome"
version = "0.1.0"
description = "Natural State take-home: BirdNET thresholds and herbaceous vegetation QA/QC"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.isort]
known-first-party = ["birds", "common"]
